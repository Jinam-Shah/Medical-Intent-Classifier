name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  DISABLE_MLFLOW: "1"           # tests never log to MLflow
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.1
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies (CPU-only torch first, so pip never pulls the CUDA build)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download NLTK tokenizer data
        run: python -m nltk.downloader punkt_tab
      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Read the model the deploy uses from render.yaml
        id: model
        run: |
          repo=$(grep -A1 'key: HF_MODEL_REPO' render.yaml | awk '/value:/ {print $2}')
          rev=$(grep -A1 'key: HF_MODEL_REVISION' render.yaml | awk '/value:/ {print $2}')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "Model: $repo@$rev"
      - uses: docker/setup-buildx-action@v4
      - name: Build the image exactly as Render does
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: medical-intent-classifier:ci
          build-args: |
            MODEL_SOURCE=hub
            HF_MODEL_REPO=${{ steps.model.outputs.repo }}
            HF_MODEL_REVISION=${{ steps.model.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it with Render free-tier limits (512 MB, 0.1 CPU)
        run: docker run -d --name app --memory 512m --cpus 0.1 -e PORT=10000 -p 8000:10000 medical-intent-classifier:ci
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Smoke test the running container
        run: python scripts/smoke_test.py http://127.0.0.1:8000 --requests 10 --max-wait 300
      - name: Container logs and stats
        if: always()
        run: |
          docker stats --no-stream app || true
          docker logs app 2>&1 | tail -50
          docker images medical-intent-classifier:ci
